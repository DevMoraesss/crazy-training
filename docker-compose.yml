# Postgres para desenvolvimento local. Em produção o banco é o Postgres da Railway.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crazy
      POSTGRES_PASSWORD: crazy
      POSTGRES_DB: crazy_training
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crazy -d crazy_training"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
